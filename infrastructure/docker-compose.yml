version: '3.8'

services:
  # =========================================================================
  # 1. PostgreSQL Database Container (Hosts 3 Isolated Databases)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: xbslabs-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_admin_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Redis In-Memory Cache (Token Blacklist & Rate Limiting)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: xbslabs-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 3. Apache Zookeeper (Kafka Coordination)
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: xbslabs-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # =========================================================================
  # 4. Apache Kafka Message Broker
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: xbslabs-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pgdata:
  redisdata:
