server:
  port: 8080

app:
  auth-service-jwks-url: ${AUTH_SERVICE_JWKS_URL:http://auth-service:8081/api/v1/auth/.well-known/jwks.json}



spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${UPSTASH_REDIS_HOST}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD}
      ssl:
        enabled: true
  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: journal-service
          uri: ${JOURNAL_SERVICE_URL:http://journal-service:8082}
          predicates:
            - Path=/api/v1/journal/**

        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://finance-service:8083}
          predicates:
            - Path=/api/v1/finance/**

        - id: productivity-service
          uri: ${PRODUCTIVITY_SERVICE_URL:http://productivity-service:8084}
          predicates:
            - Path=/api/v1/productivity/**

        - id: routine-service
          uri: ${ROUTINE_SERVICE_URL:http://routine-service:8085}
          predicates:
            - Path=/api/v1/routine/**

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG
