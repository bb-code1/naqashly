server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: finance-service
          uri: lb://FINANCE-SERVICE
          predicates:
            - Path=/api/v1/finance/**

        - id: productivity-service
          uri: lb://PRODUCTIVITY-SERVICE
          predicates:
            - Path=/api/v1/productivity/**

        - id: bot-ingress-service
          uri: lb://BOT-INGRESS-SERVICE
          predicates:
            - Path=/api/v1/bot/**

        - id: routine-service
          uri: lb://ROUTINE-SERVICE
          predicates:
            - Path=/api/v1/routine/**

        - id: journal-service
          uri: lb://JOURNAL-SERVICE
          predicates:
            - Path=/api/v1/journal/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
