name: Build and Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # 1. Path Filtering Job (Detects what directories changed)
  # =========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      journal: ${{ steps.filter.outputs.journal }}
      finance: ${{ steps.filter.outputs.finance }}
      productivity: ${{ steps.filter.outputs.productivity }}
      routine: ${{ steps.filter.outputs.routine }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'backend/api-gateway/**'
              - '.github/workflows/deploy.yml'
            auth:
              - 'backend/auth-service/**'
              - '.github/workflows/deploy.yml'
            journal:
              - 'backend/journal-service/**'
              - '.github/workflows/deploy.yml'
            finance:
              - 'backend/finance-service/**'
              - '.github/workflows/deploy.yml'
            productivity:
              - 'backend/productivity-service/**'
              - '.github/workflows/deploy.yml'
            routine:
              - 'backend/routine-service/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'infrastructure/nginx.conf'
              - '.github/workflows/deploy.yml'

  # =========================================================================
  # 2. Microservice Build & Deploy Jobs (Conditional execution)
  # =========================================================================

  deploy-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile API Gateway JAR
        run: |
          chmod +x backend/api-gateway/gradlew
          ./backend/api-gateway/gradlew -p ./backend/api-gateway bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull api-gateway
            docker compose -f docker-compose.prod.yml up -d --no-deps api-gateway

  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile Auth Service JAR
        run: |
          chmod +x backend/auth-service/gradlew
          ./backend/auth-service/gradlew -p ./backend/auth-service bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/auth-service:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull auth-service
            docker compose -f docker-compose.prod.yml up -d --no-deps auth-service

  deploy-journal:
    needs: detect-changes
    if: needs.detect-changes.outputs.journal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile Journal Service JAR
        run: |
          chmod +x backend/journal-service/gradlew
          ./backend/journal-service/gradlew -p ./backend/journal-service bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/journal-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/journal-service:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull journal-service
            docker compose -f docker-compose.prod.yml up -d --no-deps journal-service

  deploy-finance:
    needs: detect-changes
    if: needs.detect-changes.outputs.finance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile Finance Service JAR
        run: |
          chmod +x backend/finance-service/gradlew
          ./backend/finance-service/gradlew -p ./backend/finance-service bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/finance-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/finance-service:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull finance-service
            docker compose -f docker-compose.prod.yml up -d --no-deps finance-service

  deploy-productivity:
    needs: detect-changes
    if: needs.detect-changes.outputs.productivity == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile Productivity Service JAR
        run: |
          chmod +x backend/productivity-service/gradlew
          ./backend/productivity-service/gradlew -p ./backend/productivity-service bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/productivity-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/productivity-service:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull productivity-service
            docker compose -f docker-compose.prod.yml up -d --no-deps productivity-service

  deploy-routine:
    needs: detect-changes
    if: needs.detect-changes.outputs.routine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Compile Routine Service JAR
        run: |
          chmod +x backend/routine-service/gradlew
          ./backend/routine-service/gradlew -p ./backend/routine-service bootJar -x test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routine-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/routine-service:latest
      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/naqashly/infrastructure
            docker compose -f docker-compose.prod.yml pull routine-service
            docker compose -f docker-compose.prod.yml up -d --no-deps routine-service

  # =========================================================================
  # 3. Frontend Build & Nginx Deploy Job (Conditional execution)
  # =========================================================================

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install & Compile Static Files
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Transfer Static Assets to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/**"
          target: "/opt/naqashly/"
          strip_components: 0
